{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "b2exp.fullname" . }}
  labels:
    {{- include "b2exp.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}{{- toYaml . | nindent 4 }}{{- end }}
spec:
  selector:
    matchLabels: {{- include "b2exp.selectorLabels" . | nindent 6 }}
  endpoints:
    {{/* Scrape interval is unrelated to B2 cost: scrapes read process state and
         never reach Backblaze. refreshInterval is the only thing that bills. */}}
    - port: http-metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
