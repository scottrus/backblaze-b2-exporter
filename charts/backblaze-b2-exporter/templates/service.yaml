apiVersion: v1
kind: Service
metadata:
  name: {{ include "b2exp.fullname" . }}
  labels: {{- include "b2exp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http-metrics
      port: {{ .Values.service.port }}
      targetPort: http-metrics
      protocol: TCP
  selector: {{- include "b2exp.selectorLabels" . | nindent 4 }}
