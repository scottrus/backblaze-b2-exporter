{{- if not .Values.b2.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "b2exp.fullname" . }}
  labels: {{- include "b2exp.labels" . | nindent 4 }}
type: Opaque
stringData:
  B2_APPLICATION_KEY_ID: {{ required "b2.applicationKeyId is required unless b2.existingSecret is set" .Values.b2.applicationKeyId | quote }}
  B2_APPLICATION_KEY: {{ required "b2.applicationKey is required unless b2.existingSecret is set" .Values.b2.applicationKey | quote }}
{{- end }}
